name: Portfolio quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Ensure committed Pages output is current
        run: git diff --exit-code -- index.html projects 404.html robots.txt sitemap.xml
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-production
          path: dist
          include-hidden-files: true
